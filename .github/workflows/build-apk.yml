name: Build K90 Tools APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "experiment" ]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: k90-tools-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build latest installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout latest main source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show source revision
        shell: bash
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF_NAME"
          grep -E 'versionCode|versionName' app/build.gradle.kts || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Clean and build APK
        shell: bash
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Prepare artifact and build info
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk K90-Tools-debug.apk
          sha256sum K90-Tools-debug.apk > K90-Tools-debug.apk.sha256
          {
            echo "commit=$GITHUB_SHA"
            echo "branch=$GITHUB_REF_NAME"
            grep -E 'versionCode|versionName' app/build.gradle.kts | sed 's/^[[:space:]]*//'
          } > BUILD_INFO.txt
          ls -lh K90-Tools-debug.apk
          cat BUILD_INFO.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: K90-Tools-APK
          path: |
            K90-Tools-debug.apk
            K90-Tools-debug.apk.sha256
            BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30
