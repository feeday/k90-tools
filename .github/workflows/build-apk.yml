name: Build K90-Tools APK

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  push:
    branches: [ "main", "experiment" ]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: k90-tools-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build latest installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout latest main source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show source revision
        shell: bash
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF_NAME"
          grep -E 'versionCode|versionName' app/build.gradle.kts || true

      - name: Validate every bundled inline JavaScript block
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path("app/src/main/assets/puck/index.html").read_text(encoding="utf-8")
          scripts = []
          for match in re.finditer(r"<script\b([^>]*)>(.*?)</script>", html, re.I | re.S):
              attrs, body = match.groups()
              if re.search(r"\bsrc\s*=", attrs) or not body.strip():
                  continue
              scripts.append(body)

          if not scripts:
              raise SystemExit("No inline JavaScript blocks found")

          for index, body in enumerate(scripts, 1):
              Path(f"/tmp/k90-tools-puck-{index}.js").write_text(body, encoding="utf-8")
          print(f"Found {len(scripts)} inline JavaScript blocks")
          PY
          for script in /tmp/k90-tools-puck-*.js; do
            echo "Checking $script"
            node --check "$script"
          done

      - name: Test API transport and overlay prompt behavior
        run: node --test tests/puck-network.test.cjs

      - name: Check required Puck Chat integrations
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("app/src/main/assets/puck/index.html").read_text(encoding="utf-8")
          required = {
              "JSON import normalizer": "function normalizeMemory(",
              "JSON restore on startup": "function loadChatMemory()",
              "floating prompt receiver": "window.receiveOverlayPrompt",
              "native file export": "AndroidPuck.beginSaveFile",
              "native system speech fallback": "AndroidPuck.speakSystem",
              "awaited audio export": "await downloadBlob(blob",
              "image description button": 'id="btnDescribeImage"',
              "retained source media": "audioLab.sourceFile=file",
          }
          missing = [name for name, marker in required.items() if marker not in html]
          if missing:
              raise SystemExit("Missing required integrations: " + ", ".join(missing))

          ids = set(re.findall(r'id="([^"]+)"', html))
          bound = set(re.findall(r"bind\('([^']+)'", html))
          missing_bindings = sorted(bound - ids)
          if missing_bindings:
              raise SystemExit("Buttons without matching DOM elements: " + ", ".join(missing_bindings))
          print(f"Required integrations present; {len(bound)} bound controls have matching DOM elements")

          overlay_java = Path("app/src/main/java/com/ppt/k90monitor/OverlayMonitorService.java").read_text(encoding="utf-8")
          if "aiInput" in overlay_java or "chatRow" in overlay_java:
              raise SystemExit("Overlay input must remain removed")
          print("Overlay composer removed")

          manifest = Path("app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          if 'android:icon="@mipmap/ic_launcher"' not in manifest:
              raise SystemExit("Launcher icon is not registered")

          for resource in [
              "app/src/main/res/drawable/ic_launcher_foreground.xml",
              "app/src/main/res/drawable/ic_launcher_monochrome.xml",
              "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml",
              "app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml",
              "app/src/main/res/values/colors.xml",
          ]:
              if not Path(resource).is_file():
                  raise SystemExit("Missing launcher icon resource: " + resource)
          print("Temperature/full-mode composer behavior and adaptive launcher icon verified")
          PY
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Clean and build APK
        shell: bash
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Prepare artifact and build info
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk K90-Tools-debug.apk
          sha256sum K90-Tools-debug.apk > K90-Tools-debug.apk.sha256
          {
            echo "commit=$GITHUB_SHA"
            echo "branch=$GITHUB_REF_NAME"
            grep -E 'versionCode|versionName' app/build.gradle.kts | sed 's/^[[:space:]]*//'
          } > BUILD_INFO.txt
          ls -lh K90-Tools-debug.apk
          cat BUILD_INFO.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: K90-Tools-APK
          path: |
            K90-Tools-debug.apk
            K90-Tools-debug.apk.sha256
            BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30
